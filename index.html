<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodPicker ITF</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: #141416;
    background-image: url("bg.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: Tahoma, sans-serif;
    color: #e8e8ea;
  }
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    background-color: #1f2128;
    border-bottom: 3px solid #fde685;
  }
  .navbar .title { font-size: 22px; font-weight: bold; color: #fde685; letter-spacing: 1px; }
  .navbar .small { font-size: 14px; color: #a0a3ad; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    width: 360px;
    max-width: 95%;
    padding: 28px;
    text-align: center;
    background-color: #1f2128;
    border: 3px solid #fde685;
    border-radius: 32px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background-color: #272a33;
    border-radius: 24px;
  }
  .card h2 { margin: 20px 0 8px; font-size: 24px; color: #fde685; }
  .card p { margin: 6px 0 14px; color: #a0a3ad; font-size: 14px; }
  .price {
    display: inline-block;
    padding: 6px 16px;
    background-color: #272a33;
    border: 2px solid #343741;
    border-radius: 999px;
    font-size: 14px;
    color: #e8e8ea;
  }
  button {
    margin-top: 24px;
    width: 360px;
    max-width: 95%;
    padding: 14px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    background-color: #fde685;
    color: #141416;
  }
  button:hover { background-color: #fff0b3; }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="navbar">
    <span class="small">69070191</span>
    <span class="title">FOODPICKER ITF</span>
    <span class="small">Week15</span>
  </div>

  <main>
    <div class="card">
      <img id="foodImage" alt="food">
      <h2 id="foodName"></h2>
      <p id="foodDescription"></p>
      <span class="price" id="foodPrice"></span>
    </div>
    <button type="button" id="randomButton">สุ่มเมนูอาหาร</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
